<div class="auth-page">
  <!-- Brand side with geometric decoration -->
  <app-brand-panel />

  <!-- Form side -->
  <main class="form-panel">
    <section class="auth-card">
      <!-- Logo and header -->
      <header class="card-header">
        <div class="logo-badge">
          <img src="assets/images/aaps/aaps.rgb.png" alt="AAPS Logo" class="institution-logo" />
        </div>
        <h2 class="welcome-title">¡Bienvenido/a!</h2>
      </header>

      @if (errorMessage()) {
        <div class="alert error" role="alert">
          <i class="pi pi-exclamation-triangle"></i>
          <span>{{ errorMessage() }}</span>
        </div>
      }

      <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="auth-form">
        <div class="form-field">
          <label for="emailOrUsername">Correo electrónico o nombre de usuario</label>
          <div class="input-wrapper">
            <input
              pInputText
              id="emailOrUsername"
              formControlName="emailOrUsername"
              placeholder="usuario@epsa.gob.bo o usuario"
              autocomplete="username"
              type="text"
            />
            <button
              type="button"
              class="help-icon"
              aria-label="Ayuda"
              pTooltip="Ingrese su correo electrónico institucional o su nombre de usuario asignado por AAPS"
              tooltipPosition="left"
            >
              <i class="pi pi-question-circle"></i>
            </button>
          </div>
        </div>

        <div class="form-field">
          <label for="password">Contraseña</label>
          <div class="input-wrapper">
            <p-password
              formControlName="password"
              [feedback]="false"
              inputId="password"
              inputStyleClass="password-input"
              placeholder=""
              [toggleMask]="true"
              [autocomplete]="'current-password'"
            />
            <button
              type="button"
              class="help-icon"
              aria-label="Ayuda"
              pTooltip="Ingrese su contraseña. Debe tener al menos 6 caracteres"
              tooltipPosition="left"
            >
              <i class="pi pi-question-circle"></i>
            </button>
          </div>
        </div>

        <!-- Recuérdame -->
        <div class="remember-me">
          <p-checkbox formControlName="rememberMe" inputId="rememberMe" [binary]="true" />
          <label for="rememberMe">Mantener sesión iniciada</label>
        </div>

        <button
          pButton
          type="submit"
          [loading]="authFacade.isLoading()"
          [disabled]="loginForm.invalid"
          class="submit-btn"
        >
          <span>INGRESAR</span>
        </button>

        <div class="form-links">
          <a [routerLink]="['/auth/forgot-password']" class="link">Olvide mi contraseña</a>
          <a [routerLink]="['/auth/register']" class="link">Solicitud de Ingreso</a>
        </div>
      </form>
    </section>
  </main>
</div>
